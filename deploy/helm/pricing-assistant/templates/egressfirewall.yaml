{{- if .Values.openshift.egressFirewall.enabled }}
# OpenShift (OVN-Kubernetes) namespace egress allow-list by DNS name. One per namespace, named
# "default". Use it in the collector namespace so collectors reach only approved sources.
apiVersion: k8s.ovn.org/v1
kind: EgressFirewall
metadata:
  name: default
  labels:
    {{- include "pa.labels" . | nindent 4 }}
spec:
  egress:
    {{- range .Values.openshift.egressFirewall.allowDnsNames }}
    - type: Allow
      to:
        dnsName: {{ . | quote }}
    {{- end }}
    {{- range .Values.openshift.egressFirewall.allowCidrs }}
    - type: Allow
      to:
        cidrSelector: {{ . | quote }}
    {{- end }}
    - type: Deny
      to:
        cidrSelector: 0.0.0.0/0
{{- end }}
