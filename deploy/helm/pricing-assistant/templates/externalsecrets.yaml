{{- if .Values.secrets.externalSecrets.enabled }}
{{- $es := .Values.secrets.externalSecrets }}
{{- range $kind := list "backend" "migrations" "web" }}
{{- $data := index $es.data $kind }}
{{- if $data }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ index $.Values.secrets $kind }}
  labels:
    {{- include "pa.labels" $ | nindent 4 }}
  {{- if eq $kind "migrations" }}
  annotations:
    # exists before the migration hook Job runs
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ $es.secretStoreRef.name }}
  target:
    name: {{ index $.Values.secrets $kind }}
    creationPolicy: Owner
  data:
    {{- range $envKey, $ref := $data }}
    - secretKey: {{ $envKey }}
      remoteRef:
        key: {{ $ref.key }}
        {{- if $ref.property }}
        property: {{ $ref.property }}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
